<section class="sheet" id="projects" aria-labelledby="projects-title">
  <div class="container sheet__grid">
    <h2 class="sheet__title" id="projects-title">{{ ui().sections.projects }}</h2>

    <div class="project-list sheet__body">
      @for (project of projects(); track project.id) {
        <app-project-card [project]="project" [stackTitle]="ui().stackTitle" />
      }
    </div>
  </div>
</section>
